name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # --- RUN 1: ALL TESTS ---
      - name: Run all tests
        run: npm test
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-all
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/junit-all.xml

      - name: Upload HTML report (All Tests)
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-all-tests
          path: playwright-report-all/
          retention-days: 14

      - name: Upload JUnit results (All Tests)
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-results-all-tests
          path: results/junit-all.xml
          retention-days: 14

      # --- RUN 2: REPEATED CONTACT FORM ---
      - name: Run contact form test 5 times (100% pass rate check)
        run: npm run test:contact-repeat
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-five
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/junit-five.xml

      - name: Upload HTML report (Repeated Contact)
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-five-times-contact
          path: playwright-report-five/
          retention-days: 14

      - name: Upload JUnit results (Repeated Contact)
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-results-five-times-contact
          path: results/junit-five.xml
          retention-days: 14
