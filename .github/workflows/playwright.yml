name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: npm test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-all-tests
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results-all-tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: results/junit.xml
          retention-days: 14

      - name: Run contact form test 5 times (100% pass rate check)
        run: npm run test:contact-repeat

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-five-times-contact
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-five-times-contact
          path: results/junit.xml
          retention-days: 14
